[project]
name = "agentic-ai-architecture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langsmith>=0.10.10",
    "openai>=2.48.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
[tool.black]
target-version = ["py311"]
[tool.pytest.ini_options]
pythonpath = ["."]