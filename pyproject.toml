[project]
name = "agentic-ai-architecture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "deepagents>=0.6.12",
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langsmith>=0.10.10",
    "npm>=0.1.1",
    "openai>=2.48.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "vite>=1.5.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["B008"]
"backend/job_runner.py" = ["I001"]

[tool.black]
target-version = ["py311"]
[tool.pytest.ini_options]
pythonpath = ["."]
