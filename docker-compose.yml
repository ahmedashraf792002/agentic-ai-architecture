version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      APP_DB_NAME: ${APP_DB_NAME:-mvp_app}
      APP_DB_USER: ${APP_DB_USER:-mvp_app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-postgres} -d ${POSTGRES_BOOTSTRAP_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata: